name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,anthropic]"
      - run: pytest -q -rs
      - name: The wheel carries the design tokens
        run: |
          pip wheel --no-deps -w dist .
          python -c "import zipfile, glob; assert 'casca/tokens.json' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"
